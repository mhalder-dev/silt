name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Safety gates. These protect the invariants that keep Silt from destroying
  # user data. They must fail loudly, and they must actually inspect every file.
  # ---------------------------------------------------------------------------
  safety-gates:
    name: Safety gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The gates live in a script rather than inline here, so the check developers run
      # locally and the check CI runs cannot drift apart. They already did once: a local
      # copy running an older pattern passed while CI failed, which is exactly when a gate
      # stops being trustworthy. See scripts/safety-gates.ps1 for what is enforced and why.
      - name: Safety gates
        shell: pwsh
        run: pwsh scripts/safety-gates.ps1

  build-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Two categories are excluded, and both exclusions matter.
      #
      # Destructive: requires a scratch VHDX and SILT_DESTRUCTIVE_TESTS=1. A
      # silently-ignored filter here would run destructive tests against the runner, which
      # is why the filter mechanism is one we can verify rather than the newest available.
      #
      # Benchmark: these scan whole volumes, repeatedly, by design. Leaving them in was
      # measured at 471 seconds of a 531-second job - six full scans of the runner's disk
      # on every push, for numbers nobody reads. They are meant to be run deliberately:
      #   dotnet test --filter "Category=Benchmark" -l "console;verbosity=detailed"
      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Destructive&Category!=Benchmark"

  # ---------------------------------------------------------------------------
  # Package the real shippable artifact on every push, not only on a release tag.
  #
  # This job exists because the packaging path failed silently for the entire life of the
  # project and nothing noticed: the shell copied the SPA into $(OutDir) after Build, which
  # `dotnet publish` does not mirror, so every published build shipped with no wwwroot at
  # all. Build, test, lint and typecheck were all green throughout. The only way to catch
  # that class of defect is to actually produce the artifact users receive.
  # ---------------------------------------------------------------------------
  package:
    name: Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish payload
        shell: pwsh
        run: pwsh scripts/publish.ps1

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            Write-Host 'Inno Setup not present in the image; installing.'
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'ISCC.exe still not found after install.' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # Compiling the installer is what proves the .iss still matches the payload - a
      # renamed or missing source file is a compile error here rather than a broken download.
      - name: Compile installer
        shell: pwsh
        run: |
          & $env:ISCC installer\silt.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = Get-ChildItem artifacts/installer -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'No installer produced.' }
          Write-Host ('Installer: {0} ({1} MB)' -f $setup.Name, [math]::Round($setup.Length / 1MB, 1))

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
